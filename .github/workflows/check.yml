name: Validate CyberCheck
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run data && git diff --exit-code public/data/incident.json
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ && break || sleep 1; done
          npm run test:browser
